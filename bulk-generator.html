<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Trainee ID Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* General Page Styles */
        body { background: #e2e8f0; font-family: 'Roboto', sans-serif; padding: 20px; margin: 0; }
        .controls { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; max-width: 900px; margin-left: auto; margin-right: auto;}
        .controls h2 { color: #0b3b84; margin-top: 0; font-size: 24px;}
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; align-items: center; }
        
        .sheet-input { width: 90%; padding: 12px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 8px; font-family: 'Roboto', sans-serif; transition: 0.3s; background-color: #f8fafc;}
        .sheet-input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 8px rgba(37,99,235,0.2); }

        .btn-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; box-shadow: 0 4px 6px rgba(37,99,235,0.2);}
        .btn:hover { background: #1d4ed8; transform: translateY(-2px);}
        .btn-print { background: #10b981; }
        .btn-print:hover { background: #059669; }
        
        .instructions { font-size: 14px; color: #475569; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; text-align: left; border: 1px solid #e2e8f0; line-height: 1.5;}
        .instructions strong { color: #dc2626; }

        #statusMessage { font-size: 15px; margin-top: 10px; font-weight: bold; }

        /* Screen Viewing Grid */
        #bulkCardsContainer { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card-wrapper { display: flex; flex-direction: row; gap: 15px; align-items: center; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* --- ID CARD SPECIFIC STYLES (CR80: 85.6mm x 54mm Landscape) --- */
        .id-card { width: 85.6mm; height: 54mm; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 2mm; box-sizing: border-box; position: relative; overflow: hidden; }

        /* FRONT CARD: Top Header Bar */
        .header-main { background: #0b3b84; color: white; display: flex; justify-content: space-between; align-items: center; padding: 1.5mm 2mm; height: 12.5mm; box-sizing: border-box; }
        .side-logo { height: 8.5mm; width: 8.5mm; background: white; border-radius: 1mm; object-fit: contain; padding: 0.5mm; }
        .header-center { display: flex; align-items: center; justify-content: center; flex-grow: 1; flex-direction: column;}
        .header-text { text-align: center; line-height: 1.15; }
        .header-text p { margin: 0 0 0.5mm 0; font-size: 3.8pt; font-weight: 500; } 
        .header-text h1 { margin: 0; font-size: 5.5pt; font-weight: 700; letter-spacing: 0.1mm; } 
        .header-text h2 { margin: 0.5mm 0 0 0; font-size: 5.2pt; font-weight: 700; color: #facc15; } 
        
        .header-sub { background: #1d4ed8; color: white; text-align: center; font-size: 5.5pt; font-weight: 700; padding: 0.8mm 0; border-bottom: 0.5mm solid #fbbf24; }

        /* FRONT CARD: Body Layout */
        .card-body { display: flex; padding: 2.5mm 2mm; gap: 2.5mm; }
        
        .photo-section { width: 18mm; display: flex; flex-direction: column; align-items: center; z-index: 2; }
        .photo-section img { width: 15.5mm; height: 19.5mm; border: 1px solid #0b3b84; object-fit: cover; border-radius: 0.5mm;}
        .app-no-box { margin-top: 1.5mm; width: 100%; text-align: center; font-size: 4.5pt; font-weight: 700; color: #0b3b84; line-height: 1.2; background-color: #f1f5f9; border: 0.5px solid #cbd5e1; border-radius: 1mm; padding: 0.8mm 0; box-sizing: border-box; }

        .data-section { flex-grow: 1; font-size: 5pt; color: #000; line-height: 1.4; z-index: 2; padding-top: 0.5mm;}
        .data-row { margin-bottom: 0.7mm; display: flex; }
        .label { width: 44%; font-weight: 500; color: #1e293b; }
        .value { width: 56%; font-weight: 700; text-transform: uppercase; color: #0f172a;}

        /* Deputy Director Signature */
        .principal-sig { position: absolute; bottom: 2mm; right: 2mm; text-align: center; width: 30mm; z-index: 1; }
        .sig-img { height: 7.5mm; width: auto; mix-blend-mode: multiply; margin: 0 auto 0.2mm auto; display: block; }
        .principal-name { font-size: 4pt; color: #0b3b84; font-weight: 700; margin-bottom: 0.5mm; line-height: 1.2; }
        .principal-line { border-top: 0.5px solid #000; font-size: 4pt; font-weight: 700; padding-top: 0.5mm; color: #000;}

        /* --- BACK CARD STYLES --- */
        .back-body { padding: 3.5mm 3mm 12mm 3mm; font-size: 4.5pt; line-height: 1.5; color: #000; }
        .back-info strong { color: #0b3b84; }
        .instructions-block { margin-top: 2.5mm; }
        .instructions-block strong { color: #0b3b84; font-size: 5.5pt; display: block; margin-bottom: 1mm; border-bottom: 0.5px solid #cbd5e1; padding-bottom: 0.5mm; }
        .instructions-list { margin: 0; padding-left: 3.5mm; list-style-type: decimal; font-size: 4.2pt; }
        .instructions-list li { margin-bottom: 0.8mm; font-weight: 500;}
        
        .back-footer { position: absolute; bottom: 0; left: 0; width: 100%; background: #0b3b84; color: white; text-align: center; padding: 1.5mm 2mm; font-size: 4.5pt; line-height: 1.4; box-sizing: border-box; }

        /* --- PRINT SPECIFIC CSS --- */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { padding: 0; margin: 0; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none !important; }
            #bulkCardsContainer { display: grid; grid-template-columns: 1fr; row-gap: 5mm; justify-items: center; }
            .card-wrapper { page-break-inside: avoid; gap: 0; padding: 0; box-shadow: none; }
            .id-card { border: 0.5px dashed #94a3b8; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>🚀 Auto-Fetch ID Card Generator</h2>
        
        <div class="instructions">
            <strong>निर्देश:</strong><br>
            आपकी Google Sheet का लिंक पहले से ही नीचे डाला हुआ है। आपको बस <strong>"Generate All Cards"</strong> बटन पर क्लिक करना है।
        </div>

        <div class="input-group">
            <input type="text" id="sheetUrlInput" class="sheet-input" value="https://docs.google.com/spreadsheets/d/1VYjRN0V6qXv5-2sswoIJIi2Cs9BQii668p1C7O1Lw2Q/edit?usp=drivesdk" placeholder="Paste your Google Sheet Link here...">
            
            <div class="btn-row">
                <button class="btn" onclick="fetchSheetData()">⚡ Generate All Cards</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ Print All Cards</button>
            </div>
        </div>
        <div id="statusMessage"></div>
    </div>

    <div id="bulkCardsContainer"></div>

    <script>
        function updateStatus(msg, color) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }

        // Convert standard Google Drive link to Direct Image Link for rendering
        function getDirectImageUrl(url) {
            if (!url || url.trim() === '') return 'https://via.placeholder.com/60x75/e2e8f0/94a3b8?text=PHOTO';
            
            const driveRegex = /\/d\/(.*?)\//;
            const idRegex = /id=([^&]+)/;
            let fileId = '';
            
            if (url.includes('drive.google.com')) {
                if (url.match(driveRegex)) {
                    fileId = url.match(driveRegex)[1];
                } else if (url.match(idRegex)) {
                    fileId = url.match(idRegex)[1];
                }
                if (fileId) {
                    return `https://drive.google.com/uc?export=view&id=${fileId}`;
                }
            }
            return url.trim(); 
        }

        // Fetch Data Directly from Google Sheet URL using Visualization API to bypass CORS
        function fetchSheetData() {
            const urlInput = document.getElementById('sheetUrlInput').value.trim();
            if(!urlInput) {
                updateStatus("❌ Please paste a valid Google Sheet Link first.", 'red');
                return;
            }

            updateStatus("⏳ Fetching data & photos from Google Sheet...", 'orange');

            const idMatch = urlInput.match(/\/d\/([a-zA-Z0-9-_]+)/);
            const gidMatch = urlInput.match(/gid=([0-9]+)/);

            if (idMatch) {
                const sheetId = idMatch[1];
                // Using gviz/tq endpoint which handles CORS correctly for public sheets
                let exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
                if (gidMatch) {
                    exportUrl += `&gid=${gidMatch[1]}`;
                }

                fetch(exportUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("Network response was not ok");
                        return response.text();
                    })
                    .then(csvText => {
                        processData(csvText);
                        updateStatus("✅ All Cards Generated Successfully! You can now print.", 'green');
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        updateStatus("❌ Error! कृपया सुनिश्चित करें कि आपकी Google Sheet 'Anyone with the link can view' पर सेट है। (या File > Share > Publish to web करें)", 'red');
                    });
            } else {
                updateStatus("❌ Invalid Google Sheet Link format.", 'red');
            }
        }

        // Advanced CSV Parser (Handles Commas inside quotes properly)
        function CSVToArray(strData) {
            const objPattern = new RegExp(("(\\,|\\r?\\n|\\r|^)(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^\"\\,\\r\\n]*))"), "gi");
            let arrData = [[]];
            let arrMatches = null;
            while (arrMatches = objPattern.exec(strData)) {
                let strMatchedDelimiter = arrMatches[1];
                if (strMatchedDelimiter.length && strMatchedDelimiter !== ",") { arrData.push([]); }
                let strMatchedValue;
                if (arrMatches[2]) { strMatchedValue = arrMatches[2].replace(new RegExp("\"\"", "g"), "\""); } 
                else { strMatchedValue = arrMatches[3]; }
                arrData[arrData.length - 1].push(strMatchedValue);
            }
            return arrData;
        }

        function processData(csvData) {
            const rows = CSVToArray(csvData);
            if (rows.length < 2) return;

            const container = document.getElementById('bulkCardsContainer');
            container.innerHTML = ''; 

            // Timestamp detection offset (If Google Forms added a timestamp column)
            let offset = 0;
            if (rows[0][0] && rows[0][0].toLowerCase().includes("timestamp")) {
                offset = 1;
            }

            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length < 10 + offset) continue; 
                
                const cols = rows[i];

                const appNo = cols[offset + 0] ? cols[offset + 0].trim() : '';
                const name = cols[offset + 1] ? cols[offset + 1].trim() : '';
                
                if(appNo === '' && name === '') continue; 

                const father = cols[offset + 2] ? cols[offset + 2].trim() : '';
                const trade = cols[offset + 3] ? cols[offset + 3].trim() : '';
                const shiftUnit = cols[offset + 4] ? cols[offset + 4].trim() : '';
                const dob = cols[offset + 5] ? cols[offset + 5].trim() : '';
                const bloodGroup = cols[offset + 6] ? cols[offset + 6].trim() : '';
                const aadhar = cols[offset + 7] ? cols[offset + 7].trim() : '';
                // Email skipped (offset + 8)
                const mobile = cols[offset + 9] ? cols[offset + 9].trim() : '';
                const address = cols[offset + 10] ? cols[offset + 10].trim() : '';
                
                // Fetch Photo URL from the 12th column (index 11)
                const rawPhotoUrl = cols[offset + 11] ? cols[offset + 11].trim() : '';
                const finalPhotoSrc = getDirectImageUrl(rawPhotoUrl);

                const cardHTML = `
                    <div class="card-wrapper">
                        <div class="id-card">
                            <div class="header-main">
                                <img src="2.jpg" alt="Skill Logo" class="side-logo">
                                <div class="header-center">
                                    <div class="header-text">
                                        <p>(Directorate of Technical Education, Govt. of Rajasthan)</p>
                                        <h1>GOVERNMENT INDUSTRIAL TRAINING INSTITUTE, CHURU</h1>
                                        <h2>राजकीय औद्योगिक प्रशिक्षण संस्थान, चूरू</h2>
                                    </div>
                                </div>
                                <img src="1.jpg" alt="ITI Logo" class="side-logo">
                            </div>
                            <div class="header-sub">TRAINEE IDENTITY CARD / पहचान पत्र</div>
                            
                            <div class="card-body">
                                <div class="photo-section">
                                    <img src="${finalPhotoSrc}" onerror="this.src='https://via.placeholder.com/60x75/e2e8f0/94a3b8?text=PHOTO'">
                                    <div class="app-no-box">App No:<br>${appNo}</div>
                                </div>
                                <div class="data-section">
                                    <div class="data-row"><span class="label">Name / नाम:</span> <span class="value">${name}</span></div>
                                    <div class="data-row"><span class="label">Father's Name / पिता का नाम:</span> <span class="value">${father}</span></div>
                                    <div class="data-row"><span class="label">Trade / व्यवसाय:</span> <span class="value">${trade}</span></div>
                                    <div class="data-row"><span class="label">Shift / Unit:</span> <span class="value">${shiftUnit}</span></div>
                                    <div class="data-row"><span class="label">DOB / जन्म तिथि:</span> <span class="value">${dob}</span></div>
                                    <div class="data-row"><span class="label">Blood Group:</span> <span class="value" style="color: #dc2626;">${bloodGroup}</span></div>
                                    <div class="data-row"><span class="label">Aadhar No. / आधार नं.:</span> <span class="value">${aadhar}</span></div>
                                </div>
                            </div>
                            
                            <div class="principal-sig">
                                <img src="WhatsApp Image 2026-09-02 at 11.59.43 PM.jpeg" class="sig-img" alt="Signature">
                                <div class="principal-name">Deputy Director,<br>Govt. ITI, Churu</div>
                                <div class="principal-line">Sign & Seal</div>
                            </div>
                        </div>

                        <div class="id-card">
                            <div class="back-body">
                                <div class="back-info">
                                    <strong>Address / स्थायी पता:</strong><br>${address}<br><br>
                                    <strong>Mobile No. / मोबाइल नं.:</strong> ${mobile}<br>
                                    <strong>Emergency Contact / आपातकालीन संपर्क:</strong> ${father} - ${mobile}
                                </div>
                                <div class="instructions-block">
                                    <strong>Instructions / आवश्यक निर्देश:</strong>
                                    <ol class="instructions-list">
                                        <li>This card is non-transferable. / यह कार्ड अहस्तांतरणीय है।</li>
                                        <li>Must be worn during institute hours. / संस्थान परिसर में इसे पहनना अनिवार्य है।</li>
                                        <li>Valid only for the regular session. / यह केवल नियमित प्रशिक्षण अवधि के लिए मान्य है।</li>
                                        <li>If lost, inform the institute immediately. / खो जाने पर तुरंत संस्थान को सूचित करें।</li>
                                        <li>Surrender this card upon completion of training. / प्रशिक्षण पूर्ण होने पर इसे जमा करवाएं।</li>
                                    </ol>
                                </div>
                            </div>
                            <div class="back-footer">
                                If found, please return to: (यदि यह कार्ड मिले तो कृपया यहाँ लौटाएं:)<br>
                                Deputy Director, Govt. ITI Churu, Rajasthan - 331001<br>
                                Phone / फोन : 01562-250001
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
        }
    </script>
</body>
</html>
