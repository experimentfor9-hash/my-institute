<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk ITI Trainee ID Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Page Styles */
        body { background: #f1f5f9; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .controls { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        .controls h2 { color: #1e40af; margin-top: 0; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 5px; }
        .btn-print { background: #10b981; }
        .instructions { font-size: 14px; color: #475569; margin-bottom: 15px; }

        /* Screen Viewing */
        #bulkCardsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: row; 
            gap: 10px;
            align-items: center;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* --- ID CARD SPECIFIC STYLES (46mm x 73mm) --- */
        .id-card {
            width: 46mm;
            height: 73mm;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 2.5mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Front Card Header - Matched to PDF */
        .id-header {
            background: #ffffff;
            color: #1e3a8a;
            padding: 1.5mm 1mm;
            text-align: center;
            border-bottom: 1mm solid #fbbf24; 
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1mm;
            box-sizing: border-box;
            margin-bottom: 0.5mm;
        }

        .header-logos img {
            height: 6mm;
            width: 6mm;
            object-fit: contain;
            background: white;
            border-radius: 50%;
        }

        /* Font size adjusted slightly to fit "GOVERNMENT" */
        .id-header h3 { margin: 0; font-size: 5pt; font-weight: 700; line-height: 1.2; color: #dc2626; }
        .id-header p { margin: 0.5mm 0 0 0; font-size: 3.5pt; font-weight: 600; line-height: 1.2; color: #000; }
        
        /* Application No Tag */
        .app-no-tag {
            background: #1e3a8a;
            color: white;
            font-size: 4.5pt;
            font-weight: 700;
            padding: 0.5mm 2mm;
            border-radius: 1mm;
            margin-top: 1.5mm;
            display: inline-block;
        }

        /* Photo Section */
        .id-photo-block {
            text-align: center;
            margin-top: 1.5mm;
            margin-bottom: 1.5mm;
        }
        .id-photo-block img {
            width: 13mm;
            height: 17mm;
            border: 1px solid #1e3a8a;
            border-radius: 1mm;
            object-fit: cover;
        }

        /* Data Section */
        .id-data-block {
            padding: 0 2mm;
            font-size: 4pt;
            color: #000;
            line-height: 1.35;
        }
        .data-row {
            display: flex;
            margin-bottom: 0.4mm;
        }
        .data-label {
            width: 30%;
            font-weight: 700;
            color: #1e3a8a;
        }
        .data-colon {
            width: 5%;
            font-weight: 700;
        }
        .data-value {
            width: 65%;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Footer / Signatures */
        .id-footer {
            position: absolute;
            bottom: 1.5mm;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 2mm;
            box-sizing: border-box;
        }
        .sig-box {
            text-align: center;
            font-size: 3.5pt;
            font-weight: 600;
            color: #000;
            width: 45%;
        }
        .sig-line {
            border-top: 0.5px dashed #000;
            margin-bottom: 1mm;
            margin-top: 5mm; 
        }

        /* --- BACK CARD STYLES --- */
        .back-content {
            padding: 3mm 2mm;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .back-title {
            text-align: center;
            color: #1e3a8a;
            font-size: 6.5pt;
            font-weight: 700;
            margin: 0 0 2mm 0;
            padding-bottom: 1.5mm;
            border-bottom: 0.5px solid #cbd5e1;
        }
        .instructions-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 4pt;
            color: #0f172a;
        }
        .instructions-list li {
            margin-bottom: 1.5mm;
            font-weight: 600;
            line-height: 1.3;
        }
        .instructions-list li span {
            display: block;
            font-weight: 400;
            color: #64748b;
            font-size: 3.5pt;
        }
        .return-box {
            margin-top: auto;
            border: 0.5px dashed #94a3b8;
            border-radius: 1.5mm;
            padding: 1.5mm;
            text-align: center;
            background: #f8fafc;
        }

        /* --- PRINT SPECIFIC CSS (A4 Optimized) --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm 5mm; /* Very small margins to fit maximum cards */
            }
            body { 
                padding: 0; 
                margin: 0; 
                background: white; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .controls { display: none !important; }
            
            #bulkCardsContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* 2 pairs (Front & Back) per row */
                column-gap: 5mm; 
                row-gap: 5mm; 
                justify-items: center;
                align-content: flex-start;
            }
            
            .card-wrapper {
                page-break-inside: avoid; /* Prevents card from cutting across pages */
                break-inside: avoid;
                gap: 0; /* Front and back cards touch each other for easy folding */
                padding: 0;
                box-shadow: none;
                background: transparent;
            }
            
            .id-card {
                border: 0.5px dashed #94a3b8; /* Cut guides for printing */
                border-radius: 0; /* Standard for cutting */
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>🛠️ Bulk Trainee ID Card Generator (A4 Print Layout)</h2>
        <p class="instructions">
            <strong>CSV Column Order:</strong><br>
            AppNo, Name, FatherName, Trade, DOB, Mobile, Aadhar, Email, Address
        </p>
        <input type="file" id="csvFileInput" accept=".csv" class="btn" style="background: #e2e8f0; color: #0f172a;">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print All Cards (A4 Size)</button>
    </div>

    <div id="bulkCardsContainer"></div>

    <script>
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const csvData = event.target.result;
                processData(csvData);
            };
            reader.readAsText(file);
        });

        function processData(csvData) {
            const rows = csvData.split('\n');
            const container = document.getElementById('bulkCardsContainer');
            container.innerHTML = ''; 

            for (let i = 1; i < rows.length; i++) {
                if (rows[i].trim() === '') continue;
                
                // Matches your PDF Trainee format
                const cols = rows[i].split(',');

                const appNo = cols[0] ? cols[0].trim() : '';
                const name = cols[1] ? cols[1].trim() : '';
                const father = cols[2] ? cols[2].trim() : '';
                const trade = cols[3] ? cols[3].trim() : '';
                const dob = cols[4] ? cols[4].trim() : '';
                const mobile = cols[5] ? cols[5].trim() : '';
                const aadhar = cols[6] ? cols[6].trim() : '';
                const email = cols[7] ? cols[7].trim() : '';
                const address = cols[8] ? cols[8].trim() : '';
                
                const photoSrc = `photos/${appNo}.jpg`; 

                const cardHTML = `
                    <div class="card-wrapper">
                        <!-- FRONT OF CARD -->
                        <div class="id-card">
                            <div class="id-header">
                                <div class="header-logos">
                                    <img src="1.jpg" alt="ITI Logo">
                                    <img src="RJ.jpg" alt="Govt Logo" style="height:7mm; width:7mm;">
                                    <img src="2.jpg" alt="Skill Logo">
                                </div>
                                <h3>GOVERNMENT INDUSTRIAL<br>TRAINING INSTITUTE</h3>
                                <p>Churu, Rajasthan-331001</p>
                            </div>
                            
                            <div style="text-align: center;">
                                <div class="app-no-tag">Application: ${appNo}</div>
                            </div>

                            <div class="id-photo-block">
                                <img src="${photoSrc}" onerror="this.src='https://via.placeholder.com/50x65/e2e8f0/94a3b8?text=PHOTO'">
                            </div>
                            
                            <div class="id-data-block">
                                <div class="data-row"><span class="data-label">Name</span><span class="data-colon">:</span><span class="data-value">${name}</span></div>
                                <div class="data-row"><span class="data-label">Father</span><span class="data-colon">:</span><span class="data-value">${father}</span></div>
                                <div class="data-row"><span class="data-label">Trade</span><span class="data-colon">:</span><span class="data-value">${trade}</span></div>
                                <div class="data-row"><span class="data-label">D.O.B.</span><span class="data-colon">:</span><span class="data-value">${dob}</span></div>
                                <div class="data-row"><span class="data-label">Mobile</span><span class="data-colon">:</span><span class="data-value">${mobile}</span></div>
                                <div class="data-row"><span class="data-label">Aadhar</span><span class="data-colon">:</span><span class="data-value">${aadhar}</span></div>
                                <div class="data-row"><span class="data-label">Email ID</span><span class="data-colon">:</span><span class="data-value" style="font-size:3.2pt; text-transform:none;">${email}</span></div>
                                <div class="data-row"><span class="data-label">Address</span><span class="data-colon">:</span><span class="data-value" style="font-size:3.5pt; text-transform:none;">${address}</span></div>
                            </div>

                            <div class="id-footer">
                                <div class="sig-box">
                                    <div class="sig-line"></div>
                                    Student Sign
                                </div>
                                <div class="sig-box">
                                    <div class="sig-line"></div>
                                    Principal/Dy. Director
                                </div>
                            </div>
                        </div>

                        <!-- BACK OF CARD -->
                        <div class="id-card">
                            <div class="back-content">
                                <h4 class="back-title">Instructions / निर्देश</h4>
                                <ul class="instructions-list">
                                    <li>1. यह पहचान पत्र राजकीय ITI, चूरू की संपत्ति है।
                                        <span>(This card is the property of Govt. ITI, Churu.)</span>
                                    </li>
                                    <li>2. ड्यूटी के दौरान इसे पहनना अनिवार्य है।
                                        <span>(It is mandatory to wear this card during duty hours.)</span>
                                    </li>
                                    <li>3. यह कार्ड अहस्तांतरणीय है।
                                        <span>(This card is non-transferable.)</span>
                                    </li>
                                </ul>
                                
                                <div class="return-box">
                                    <div style="color: #ef4444; font-weight: 700; font-size: 4.5pt; margin-bottom: 1mm;">If found, please return to:</div>
                                    <div style="font-size: 3.5pt; font-weight: 600; color: #1e293b; line-height: 1.4;">
                                        OFFICE OF THE DEPUTY DIRECTOR<br>
                                        Government Industrial Training Institute<br>
                                        Churu, Rajasthan-331001
                                    </div>
                                    <div style="color: #1d4ed8; font-weight: 700; margin-top: 1.5mm; font-size: 4pt;">
                                        📞 Contact: 01568-274299
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
        }
    </script>
</body>
</html>
