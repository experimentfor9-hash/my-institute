<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk ITI Employee ID Card Generator - CR80 Size</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Page Styles */
        body { background: #f1f5f9; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .controls { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        .controls h2 { color: #1e40af; margin-top: 0; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 5px; }
        .btn-print { background: #10b981; }
        .instructions { font-size: 14px; color: #475569; margin-bottom: 15px; }

        /* Grid for Screen Viewing */
        #bulkCardsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Card Container (Front & Back Wrapper) */
        .card-wrapper {
            display: flex;
            flex-direction: row; /* Front and Back side-by-side */
            gap: 10px;
            align-items: center;
        }

        /* --- ID CARD SPECIFIC STYLES (CR80 Standard: 54mm x 85.6mm) --- */
        .id-card {
            width: 54mm;
            height: 85.6mm;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 2.5mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Front Card Header */
        .id-header {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            padding: 2mm 1.5mm;
            text-align: center;
            border-bottom: 1mm solid #fbbf24; 
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1mm;
            box-sizing: border-box;
            margin-bottom: 1.5mm;
        }

        .header-logos img {
            height: 7mm;
            width: 7mm;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 0.5mm;
        }

        .header-logos img.center-logo {
            background: transparent;
            height: 8mm;
            border-radius: 0;
            padding: 0;
        }

        .id-header h3 { margin: 0; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.2mm;}
        .id-header p { margin: 0.5mm 0 0 0; font-size: 4.5pt; font-weight: 600; line-height: 1.2; }
        
        /* Photo Section */
        .id-photo-block {
            text-align: center;
            margin-top: 3mm;
            margin-bottom: 2mm;
        }
        .id-photo-block img {
            width: 16.5mm;
            height: 21mm;
            border: 1px solid #8b5cf6;
            border-radius: 1mm;
            object-fit: cover;
        }

        /* Data Section */
        .id-data-block {
            padding: 0 2.5mm;
            font-size: 4.8pt;
            color: #1e293b;
            line-height: 1.35;
        }
        .data-row {
            display: flex;
            margin-bottom: 0.4mm;
        }
        .data-label {
            width: 35%;
            font-weight: 600;
            color: #475569;
        }
        .data-colon {
            width: 5%;
            font-weight: 600;
        }
        .data-value {
            width: 60%;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Footer / Signatures */
        .id-footer {
            position: absolute;
            bottom: 1.5mm;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 2.5mm;
            box-sizing: border-box;
        }
        .sig-box {
            text-align: center;
            font-size: 4pt;
            font-weight: 600;
            color: #0f172a;
            width: 45%;
        }
        .sig-line {
            border-top: 1px dashed #94a3b8;
            margin-bottom: 1mm;
            margin-top: 6mm; /* Space for signature */
        }

        /* --- BACK CARD STYLES --- */
        .back-content {
            padding: 3.5mm 2.5mm;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .back-title {
            text-align: center;
            color: #1e3a8a;
            font-size: 7.5pt;
            font-weight: 700;
            margin: 0 0 2.5mm 0;
            padding-bottom: 1.5mm;
            border-bottom: 0.5px solid #cbd5e1;
        }
        .instructions-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 4.5pt;
            color: #0f172a;
        }
        .instructions-list li {
            margin-bottom: 2mm;
            font-weight: 600;
            line-height: 1.3;
        }
        .instructions-list li span {
            display: block;
            font-weight: 400;
            color: #64748b;
            font-size: 4pt;
        }
        .return-box {
            margin-top: auto;
            border: 1px dashed #94a3b8;
            border-radius: 1.5mm;
            padding: 2mm;
            text-align: center;
            background: #f8fafc;
        }
        .return-title {
            color: #ef4444;
            font-weight: 700;
            font-size: 5pt;
            margin-bottom: 1mm;
        }
        .return-address {
            font-size: 4pt;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
        }
        .return-contact {
            color: #1d4ed8;
            font-weight: 700;
            margin-top: 1.5mm;
            font-size: 4.5pt;
        }

        /* --- PRINT SPECIFIC CSS --- */
        @media print {
            body { padding: 0; background: white; }
            .controls { display: none; }
            
            #bulkCardsContainer {
                display: flex;
                flex-wrap: wrap;
                gap: 5mm; /* Gap between cards on A4 */
                justify-content: flex-start;
            }
            .card-wrapper {
                page-break-inside: avoid;
                gap: 0; /* Front and back touch for easy folding or cutting */
            }
            .id-card {
                box-shadow: none;
                border: 0.5px dashed #94a3b8; /* Cut guides */
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>🛠️ Bulk Employee ID Card Generator (CR80 Size)</h2>
        <p class="instructions">
            <strong>CSV Column Order:</strong><br>
            EmployeeID, Name, FatherName, DOB, Designation, Mobile, BloodGroup, Aadhar, PAN, Address
        </p>
        <input type="file" id="csvFileInput" accept=".csv" class="btn" style="background: #e2e8f0; color: #0f172a;">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print All Cards (A4 / CR80 PVC)</button>
    </div>

    <div id="bulkCardsContainer"></div>

    <script>
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const csvData = event.target.result;
                processData(csvData);
            };
            reader.readAsText(file);
        });

        function processData(csvData) {
            const rows = csvData.split('\n');
            const container = document.getElementById('bulkCardsContainer');
            container.innerHTML = ''; 

            for (let i = 1; i < rows.length; i++) {
                if (rows[i].trim() === '') continue;
                
                const cols = rows[i].split(',');

                const empId = cols[0] ? cols[0].trim() : '';
                const name = cols[1] ? cols[1].trim() : '';
                const father = cols[2] ? cols[2].trim() : '';
                const dob = cols[3] ? cols[3].trim() : '';
                const designation = cols[4] ? cols[4].trim() : '';
                const mobile = cols[5] ? cols[5].trim() : '';
                const bloodGroup = cols[6] ? cols[6].trim() : '';
                const aadhar = cols[7] ? cols[7].trim() : '';
                const pan = cols[8] ? cols[8].trim() : '';
                const address = cols[9] ? cols[9].trim() : '';
                
                const photoSrc = `photos/${empId}.jpg`; 

                const cardHTML = `
                    <div class="card-wrapper">
                        <!-- FRONT OF CARD -->
                        <div class="id-card">
                            <div class="id-header">
                                <div class="header-logos">
                                    <img src="1.jpg" alt="ITI Logo">
                                    <img src="RJ.jpg" class="center-logo" alt="Govt Logo">
                                    <img src="2.jpg" alt="Skill Logo">
                                </div>
                                <h3>राजस्थान सरकार</h3>
                                <p>कौशल नियोजन एवं उद्यमिता विभाग<br>राजकीय औद्योगिक प्रशिक्षण संस्थान,चूरू(राज.)</p>
                            </div>
                            
                            <div class="id-photo-block">
                                <img src="${photoSrc}" onerror="this.src='https://via.placeholder.com/60x75/e2e8f0/94a3b8?text=PHOTO'">
                            </div>
                            
                            <div class="id-data-block">
                                <div class="data-row"><span class="data-label">Name</span><span class="data-colon">:</span><span class="data-value">${name}</span></div>
                                <div class="data-row"><span class="data-label">Father's Name</span><span class="data-colon">:</span><span class="data-value">${father}</span></div>
                                <div class="data-row"><span class="data-label">D.O.B.</span><span class="data-colon">:</span><span class="data-value">${dob}</span></div>
                                <div class="data-row"><span class="data-label">Designation</span><span class="data-colon">:</span><span class="data-value">${designation}</span></div>
                                <div class="data-row"><span class="data-label">EMPLOYEE ID</span><span class="data-colon">:</span><span class="data-value">${empId}</span></div>
                                <div class="data-row"><span class="data-label">Mobile No</span><span class="data-colon">:</span><span class="data-value">${mobile}</span></div>
                                <div class="data-row"><span class="data-label">Blood Group</span><span class="data-colon">:</span><span class="data-value">${bloodGroup}</span></div>
                                <div class="data-row"><span class="data-label">U.I.D. No</span><span class="data-colon">:</span><span class="data-value">${aadhar}</span></div>
                                <div class="data-row"><span class="data-label">PAN No</span><span class="data-colon">:</span><span class="data-value">${pan}</span></div>
                                <div class="data-row"><span class="data-label">Address</span><span class="data-colon">:</span><span class="data-value" style="font-size:3.8pt; line-height:1.2; text-transform:none;">${address}</span></div>
                            </div>

                            <div class="id-footer">
                                <div class="sig-box">
                                    <div class="sig-line"></div>
                                    हस्ताक्षर कर्मचारी
                                </div>
                                <div class="sig-box">
                                    <div class="sig-line"></div>
                                    उपनिदेशक<br>राजकीय औद्योगिक प्रशिक्षण<br>संस्थान, चूरू(राज.)
                                </div>
                            </div>
                        </div>

                        <!-- BACK OF CARD -->
                        <div class="id-card">
                            <div class="back-content">
                                <h4 class="back-title">Instructions / निर्देश</h4>
                                <ul class="instructions-list">
                                    <li>1. यह पहचान पत्र राजकीय ITI, चूरू की संपत्ति है।
                                        <span>(This card is the property of Govt. ITI, Churu.)</span>
                                    </li>
                                    <li>2. ड्यूटी के दौरान इसे पहनना अनिवार्य है।
                                        <span>(It is mandatory to wear this card during duty hours.)</span>
                                    </li>
                                    <li>3. यह कार्ड अहस्तांतरणीय है।
                                        <span>(This card is non-transferable.)</span>
                                    </li>
                                    <li>4. खो जाने पर तुरंत कार्यालय को सूचित करें।
                                        <span>(If lost, report to the office immediately.)</span>
                                    </li>
                                </ul>
                                
                                <div class="return-box">
                                    <div class="return-title">If found, please return to:</div>
                                    <div class="return-address">
                                        OFFICE OF THE DEPUTY DIRECTOR<br>
                                        Govt. Industrial Training Institute, Richo<br>
                                        Industrial Area, RoadNo. 05<br>
                                        Churu, Rajasthan - 331001
                                    </div>
                                    <div class="return-contact">
                                        📞 Contact: 01562-253280
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
        }
    </script>
</body>
</html>
